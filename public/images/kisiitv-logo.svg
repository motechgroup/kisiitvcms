<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" class="h-full w-auto">
  <defs>
    <!-- Gradients matching the Kisii TV 3D logo -->
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a6ce6" />
      <stop offset="50%" stop-color="#1b52bc" />
      <stop offset="100%" stop-color="#0f3d99" />
    </linearGradient>
    <linearGradient id="redK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0333b" />
      <stop offset="40%" stop-color="#d9252a" />
      <stop offset="100%" stop-color="#a81216" />
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b52bc" />
      <stop offset="100%" stop-color="#124099" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- OUTER CIRCULAR EMBLEM -->
    <!-- Red outer ring -->
    <circle cx="58" cy="58" r="54" fill="none" stroke="#d9252a" stroke-width="3" />
    <!-- White separation ring -->
    <circle cx="58" cy="58" r="50" fill="none" stroke="#ffffff" stroke-width="4" />
    <!-- Thick royal blue ring -->
    <circle cx="58" cy="58" r="44" fill="none" stroke="url(#blueRing)" stroke-width="12" filter="url(#subtleShadow)" />

    <!-- STYLIZED RED "K" WING -->
    <g filter="url(#subtleShadow)">
      <!-- Vertical stem of K with editorial serif -->
      <path d="M 36 28 L 47 28 L 47 38 L 43 40 L 43 76 L 47 78 L 47 88 L 36 88 L 36 78 L 40 76 L 40 40 L 36 38 Z" fill="url(#redK)" />
      <!-- Upper diagonal wing sweeping out of the ring -->
      <path d="M 43 55 C 50 48, 62 38, 80 18 C 76 34, 70 47, 54 62 L 78 88 L 65 88 L 48 68 L 43 73 Z" fill="url(#redK)" />
      <!-- Lower diagonal arm with serif foot -->
      <path d="M 52 64 L 75 88 L 84 88 L 59 60 Z" fill="url(#redK)" opacity="0.9" />
    </g>

    <!-- BLUE KISII TV PILL BADGE EXTENDING TO RIGHT -->
    <g filter="url(#subtleShadow)">
      <rect x="74" y="44" width="94" height="28" rx="8" ry="8" fill="url(#badgeBlue)" stroke="#ffffff" stroke-width="1.5" />
      <text x="121" y="63" font-family="'Instrument Sans', Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">KISII TV</text>
    </g>
  </g>

  <!-- TEXT TYPOGRAPHY TO RIGHT OF BADGE -->
  <g transform="translate(185, 20)">
    <text x="0" y="34" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="#0b1a3d" letter-spacing="-0.5">
      KISII<tspan fill="#d9252a">TV</tspan>
    </text>
    <!-- Official Slogan from Logo in Gusii language -->
    <text x="2" y="58" font-family="'Instrument Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#1b52bc" letter-spacing="0.5">
      Amandegere Y'Omogusii
    </text>
  </g>
</svg>
